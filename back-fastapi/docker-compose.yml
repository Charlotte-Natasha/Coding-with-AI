version: '3.8'

services:
  postgresql:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: psql -U postgres -d postgres_data

  back-fastapi:
    image: fastapi:latest
    volumes:
      - .:/app
      - ./data:/app.data
    depends_on:
      - postgresql
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  vite-project:
    image: vite:vite@master
    volumes:
      - .:/vite/vite-react-app
    command: 'cd /vite/vite-react-app && vite build'

volumes:
  postgres_data:
  data: