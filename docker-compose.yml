
services:
  postgresql:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"


  back-fastapi:
    build: ./back-fastapi
    volumes:
      - .:/app
      - ./data:/app.data
    depends_on:
      - postgresql
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  vite-react:
    build: ./vite-project
    container_name: vite_container
    ports:
      - "5173:5173"
    command: npm run dev

volumes:
  postgres_data:
  data: